enabled: true
# Optional repo list when using GITHUB_TOKEN (merged with GITHUB_REPOS env)
# repos:
#   - owner/repo-a
# Off: pushes (including PR head branches) must not auto-enqueue scans.
scan_on_push: false
# Off by default: only QA PRs the user asks for (Slack/chat, dashboard, /deep-review,
# or the deep_review_on_label below). Set true to auto-scan every opened/updated PR.
scan_on_pr: false
deep_review_on_pr: false
local_checks:
  - ruff
  - pytest
branch_ignore:
  - "dependabot/**"
comment_on_ci_failure: true
auto_comment_severity:
  - critical
  - high
deep_review_on_label: tempa-deep-review
scan_stale_branch_days: 30
pytest_timeout_seconds: 600
ruff_paths:
  - src
  - tests
